include:
  - docker-compose.images.yaml

services:
  # Stopped after create: `compose cp` seeds these volumes through Docker's archive API.
  seed:
    extends:
      file: docker-compose.images.yaml
      service: execution-image
    profiles: ["cache", "remote_execution"]
    command: ["/bin/true"]
    volumes:
      - config:/config
      - storage-cas:/storage-cas
      - storage-ac:/storage-ac
      - storage-fsac:/storage-fsac
      - bb:/bb
      - worker:/worker

  # Every gRPC stream reaches cache/frontend from this stack's own network.
  relay:
    extends:
      file: docker-compose.images.yaml
      service: execution-image
    profiles: ["cache", "remote_execution"]
    command: ["sleep", "infinity"]

  cache:
    extends:
      file: docker-compose.images.yaml
      service: bb-storage-image
    profiles: ["cache"]
    command: ["/config/cache.jsonnet"]
    volumes:
      - config:/config:ro
      - storage-cas:/storage-cas
      - storage-ac:/storage-ac

  storage:
    extends:
      file: docker-compose.images.yaml
      service: bb-storage-image
    profiles: ["remote_execution"]
    command: ["/config/storage.jsonnet"]
    volumes:
      - config:/config:ro
      - storage-cas:/storage-cas
      - storage-ac:/storage-ac
      - storage-fsac:/storage-fsac

  frontend:
    extends:
      file: docker-compose.images.yaml
      service: bb-storage-image
    profiles: ["remote_execution"]
    command: ["/config/frontend.jsonnet"]
    depends_on:
      - storage
      - scheduler
    volumes:
      - config:/config:ro

  scheduler:
    extends:
      file: docker-compose.images.yaml
      service: bb-scheduler-image
    profiles: ["remote_execution"]
    command: ["/config/scheduler.jsonnet"]
    depends_on:
      - storage
    volumes:
      - config:/config:ro

  runner-installer:
    extends:
      file: docker-compose.images.yaml
      service: bb-runner-installer-image
    profiles: ["remote_execution"]
    restart: "no"
    volumes:
      - bb:/bb

  runner:
    extends:
      file: docker-compose.images.yaml
      service: execution-image
    profiles: ["remote_execution"]
    command:
      - sh
      - -c
      - while ! test -f /bb/installed; do sleep 1; done; exec /bb/bb_runner /config/runner.jsonnet
    network_mode: none
    depends_on:
      - runner-installer
    volumes:
      - config:/config:ro
      - bb:/bb
      - worker:/worker

  worker:
    extends:
      file: docker-compose.images.yaml
      service: bb-worker-image
    profiles: ["remote_execution"]
    command: ["/config/worker.jsonnet"]
    depends_on:
      - storage
      - scheduler
      - runner
    volumes:
      - config:/config:ro
      - worker:/worker

volumes:
  config:
  storage-cas:
  storage-ac:
  storage-fsac:
  bb:
  worker:
