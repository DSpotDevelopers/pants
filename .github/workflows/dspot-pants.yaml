name: DSpot Pants

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: dspot-pants-${{ github.event.pull_request.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  source:
    # The one place that decides who may start this build (its script below checks a dispatch the same way): a pull
    # request from this repository by an owner, member or collaborator, or by the GitHub App our worker lines open pull
    # requests as, named by its exact login. Every other job runs only through `needs: source`.
    if: >-
      github.repository == 'DSpotDevelopers/pants'
      && ((github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/'))
          || (github.event_name == 'pull_request_target'
              && (github.event.pull_request.author_association == 'OWNER'
                  || github.event.pull_request.author_association == 'MEMBER'
                  || github.event.pull_request.author_association == 'COLLABORATOR'
                  || github.event.pull_request.user.login == 'dspot-worker-lines[bot]')
              && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, linux, x64, slot-cpus-1]
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    outputs:
      head: ${{ steps.source.outputs.head }}
      base: ${{ steps.source.outputs.base }}
    steps:
      - id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            let number = process.env.PR_NUMBER;
            if (context.eventName === 'workflow_dispatch') {
              if (!context.ref.startsWith('refs/heads/')) {
                throw new Error('Dispatch requires a branch with an open pull request');
              }
              const {data: prs} = await github.rest.pulls.list({
                ...context.repo, state: 'open',
                head: `${context.repo.owner}:${context.ref.slice('refs/heads/'.length)}`,
                per_page: 100
              });
              if (prs.length !== 1) {
                throw new Error('Dispatch requires exactly one open pull request for this branch');
              }
              number = String(prs[0].number);
            }
            if (!/^[1-9][0-9]*$/.test(number)) {
              throw new Error('A pull request number is required');
            }
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(number)
            });
            const trusted = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association)
                || (pr.user.type === 'Bot' && pr.user.login === 'dspot-worker-lines[bot]');
            if (pr.state !== 'open' || pr.draft || !trusted
                || pr.head.repo.full_name !== context.payload.repository.full_name) {
              throw new Error('Only ready pull requests from this repository by its owners, members, collaborators or the workers\' App may execute');
            }
            if (context.eventName === 'workflow_dispatch'
                && (pr.head.sha !== context.sha
                    || pr.head.ref !== context.ref.slice('refs/heads/'.length))) {
              throw new Error('Dispatch must match the pull request branch and its current head');
            }
            core.setOutput('head', pr.head.sha);
            core.setOutput('base', pr.base.sha);
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: pr.head.sha, state: 'pending', context: 'DSpot Pants',
              description: 'Building and testing this exact source head',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  python-bootstrap:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        runner-class: [heavy-ok, slot-medium]
    runs-on: [self-hosted, linux, x64, dspot, '${{ matrix.runner-class }}']
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.head }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove the interpreter and its venv without the job's loader environment
        run: build-support/bin/dspot_ci_python.sh

  build:
    needs: [source, python-bootstrap]
    # `dspot` alone also matches the shared 1-vCPU medium slots; `heavy-ok` is carried only by the full slots of the
    # 16-core hosts, the class dspot-company-data's heavy jobs request (COMPANY_CI_HEAVY_RUNS_ON).
    runs-on: [self-hosted, linux, x64, dspot, heavy-ok]
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '1'
      PANTS_PANTSD: 'false'
      PANTS_PROCESS_EXECUTION_LOCAL_PARALLELISM: '1'
      PANTS_REMOTE_CACHE_READ: 'false'
      PANTS_REMOTE_CACHE_WRITE: 'false'
      HONEYCOMB_API_KEY: --DISABLED--
      PANTS_OPENTELEMETRY_ENABLED: 'False'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned standalone Python
        run: build-support/bin/dspot_ci_python.sh
      - name: Install the source's Rust toolchain
        run: |
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          "$HOME/.cargo/bin/rustup" default "$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' src/rust/rust-toolchain)"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: src/rust
          cache-bin: 'false'
      - name: Install Protoc
        uses: benjyw/setup-protoc@fa4f90fddf8838036cbdeadf1262b9755f6cfb85
        with:
          version: 23.x
      # The source's own script builds the release (its natives linked against the glibc 2.28 floor, then checked), so
      # a pull request that changes how the release is built proves it in its own run.
      - name: Build the release from the checked source
        env:
          EXPECTED_HEAD: ${{ needs.source.outputs.head }}
        run: build-support/bin/dspot_release_build.sh
      - name: Test changed JavaScript inference in Rust
        env:
          BASE: ${{ needs.source.outputs.base }}
        run: |
          if ! git diff --quiet "$BASE...HEAD" -- src/rust/dep_inference; then
            ./cargo test --locked -p dep_inference javascript::tests
          fi
      - name: Retain the matching native engine
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-${{ needs.source.outputs.head }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src/python/pants/bin/native_client
            src/python/pants/bin/sandboxer
            src/python/pants/bin/pants_lock
            src/python/pants/engine/internals/native_engine.so
            src/python/pants/engine/internals/native_engine.so.metadata
      - name: Retain the un-published release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ needs.source.outputs.head }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/deploy/wheels
            dist/src.python.pants/pants-pex*
      - name: Report build memory
        if: always()
        run: |
          if test -r /sys/fs/cgroup/memory.peak; then
            printf 'Build peak memory (bytes): ' >> "$GITHUB_STEP_SUMMARY"
            cat /sys/fs/cgroup/memory.peak >> "$GITHUB_STEP_SUMMARY"
          fi

  tests:
    needs: [source, build]
    # The build's runner class: the focused suites run up to 6 minutes each (a JavaScript integration suite 202 s of
    # its 240 s limit), and a 1-vCPU medium slot shared with other jobs ran past them (runs 45668070356, 45711444202).
    runs-on: [self-hosted, linux, x64, dspot, heavy-ok]
    timeout-minutes: 30
    env:
      PANTS_PANTSD: 'false'
      PANTS_PROCESS_EXECUTION_LOCAL_PARALLELISM: '1'
      HONEYCOMB_API_KEY: --DISABLED--
      PANTS_OPENTELEMETRY_ENABLED: 'False'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.head }}
          fetch-depth: 1
          persist-credentials: false
      # `--changed-since` diffs BASE...HEAD, so the job needs the two tips and their merge base, and nothing else: a full
      # history fetch (every branch and tag of the fork) took 14 of this job's 30 minutes (run 45668070356, attempt 1).
      # Both tips deepen together until they share their merge base.
      - name: The base commit and the merge base with the head, nothing else
        env:
          BASE: ${{ needs.source.outputs.base }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          fetch() { git -c protocol.version=2 fetch --no-tags --quiet "$@" origin "$BASE" "$head"; }
          fetch --depth=50
          for _ in $(seq 40); do
            if git merge-base "$BASE" "$head" > /dev/null; then exit 0; fi
            fetch --deepen=200
          done
          fetch --unshallow
          git merge-base "$BASE" "$head" > /dev/null
      # The interpreters the focused suites run under, as upstream's own test jobs install them
      # (pants_release/generate_github_workflows.py, install_pythons): the runner image carries none
      # of them. Pants itself uses the standalone interpreter installed immediately afterwards.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: |
            3.8.18
            3.10.22
            3.11.18
      - name: Install the pinned standalone Python
        run: build-support/bin/dspot_ci_python.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-${{ needs.source.outputs.head }}
          path: src/python/pants
      - name: Restore executable permissions
        run: chmod +x src/python/pants/bin/native_client src/python/pants/bin/sandboxer src/python/pants/bin/pants_lock
      - name: Run only the patch and its direct dependent suites
        env:
          BASE: ${{ needs.source.outputs.base }}
          EXPECTED_HEAD: ${{ needs.source.outputs.head }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          TIMEFORMAT='tests elapsed=%R user=%U system=%S seconds'
          time ./pants --changed-since="$BASE" --changed-dependents=direct lint test
      - name: Report test memory
        if: always()
        run: |
          if test -r /sys/fs/cgroup/memory.peak; then
            printf 'Tests peak memory (bytes): ' >> "$GITHUB_STEP_SUMMARY"
            cat /sys/fs/cgroup/memory.peak >> "$GITHUB_STEP_SUMMARY"
          fi

  result:
    if: always() && needs.source.result == 'success'
    needs: [source, build, tests]
    runs-on: [self-hosted, linux, x64, slot-cpus-1]
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          HEAD_SHA: ${{ needs.source.outputs.head }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        with:
          script: |
            const passed = process.env.BUILD_RESULT === 'success' && process.env.TEST_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.HEAD_SHA,
              state: passed ? 'success' : 'failure', context: 'DSpot Pants',
              description: `Release build: ${process.env.BUILD_RESULT}; focused tests: ${process.env.TEST_RESULT}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!passed) core.setFailed('The source build and focused tests must both pass');
