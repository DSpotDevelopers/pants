name: DSpot Pants

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: dspot-pants-${{ github.event.pull_request.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  source:
    if: >-
      github.repository == 'DSpotDevelopers/pants'
      && github.event_name == 'pull_request_target'
      && (github.event.pull_request.author_association == 'OWNER'
          || github.event.pull_request.author_association == 'MEMBER'
          || github.event.pull_request.author_association == 'COLLABORATOR')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, slot-cpus-1]
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    outputs:
      head: ${{ steps.source.outputs.head }}
      base: ${{ steps.source.outputs.base }}
    steps:
      - id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.PR_NUMBER)) {
              throw new Error('A pull request number is required');
            }
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER)
            });
            if (pr.state !== 'open' || pr.draft
                || !['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association)
                || pr.head.repo.full_name !== context.payload.repository.full_name) {
              throw new Error('Only ready pull requests by repository owners, members or collaborators from this repository may execute');
            }
            core.setOutput('head', pr.head.sha);
            core.setOutput('base', pr.base.sha);
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: pr.head.sha, state: 'pending', context: 'DSpot Pants',
              description: 'Building and testing this exact source head',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  build:
    if: >-
      github.repository == 'DSpotDevelopers/pants'
      && github.event_name == 'pull_request_target'
      && (github.event.pull_request.author_association == 'OWNER'
          || github.event.pull_request.author_association == 'MEMBER'
          || github.event.pull_request.author_association == 'COLLABORATOR')
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: source
    runs-on: [self-hosted, linux, x64, dspot]
    timeout-minutes: 90
    outputs:
      version: ${{ steps.release.outputs.version }}
    container: quay.io/pypa/manylinux_2_28_x86_64:latest
    env:
      PY: /opt/python/cp314-cp314/bin/python
      CARGO_BUILD_JOBS: '1'
      PANTS_PANTSD: 'false'
      PANTS_PROCESS_EXECUTION_LOCAL_PARALLELISM: '1'
      PANTS_REMOTE_CACHE_READ: 'false'
      PANTS_REMOTE_CACHE_WRITE: 'false'
      HONEYCOMB_API_KEY: --DISABLED--
      PANTS_OPENTELEMETRY_ENABLED: 'False'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Expose the build interpreter
        run: echo /opt/python/cp314-cp314/bin >> "$GITHUB_PATH"
      - name: Install the source's Rust toolchain
        run: |
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          "$HOME/.cargo/bin/rustup" default "$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' src/rust/rust-toolchain)"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: src/rust
          cache-bin: 'false'
      - name: Install Protoc
        uses: benjyw/setup-protoc@fa4f90fddf8838036cbdeadf1262b9755f6cfb85
        with:
          version: 23.x
      - name: Build the release from the checked source
        id: release
        env:
          EXPECTED_HEAD: ${{ needs.source.outputs.head }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          version="$(cat src/python/pants/VERSION)"
          [[ "$version" =~ ^[0-9][A-Za-z0-9.+-]*$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          TIMEFORMAT='release elapsed=%R user=%U system=%S seconds'
          time {
            ./pants run src/python/pants_release/release.py -- build-wheels
            ./pants package src/python/pants:pants-pex
          }
      - name: Test changed JavaScript inference in Rust
        env:
          BASE: ${{ needs.source.outputs.base }}
        run: |
          if ! git diff --quiet "$BASE...HEAD" -- src/rust/dep_inference; then
            ./cargo test --locked -p dep_inference javascript::tests
          fi
      - name: Retain the matching native engine
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-${{ needs.source.outputs.head }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src/python/pants/bin/native_client
            src/python/pants/bin/sandboxer
            src/python/pants/bin/pants_lock
            src/python/pants/engine/internals/native_engine.so
            src/python/pants/engine/internals/native_engine.so.metadata
      - name: Retain the un-published release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ needs.source.outputs.head }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/deploy/wheels
            dist/src.python.pants/pants-pex*
      - name: Report build memory
        if: always()
        run: |
          if test -r /sys/fs/cgroup/memory.peak; then
            printf 'Build peak memory (bytes): ' >> "$GITHUB_STEP_SUMMARY"
            cat /sys/fs/cgroup/memory.peak >> "$GITHUB_STEP_SUMMARY"
          fi

  tests:
    if: >-
      github.repository == 'DSpotDevelopers/pants'
      && github.event_name == 'pull_request_target'
      && (github.event.pull_request.author_association == 'OWNER'
          || github.event.pull_request.author_association == 'MEMBER'
          || github.event.pull_request.author_association == 'COLLABORATOR')
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: [source, build]
    runs-on: [self-hosted, linux, x64, slot-medium]
    timeout-minutes: 30
    container: quay.io/pypa/manylinux_2_28_x86_64:latest
    env:
      PY: /opt/python/cp314-cp314/bin/python
      PANTS_PANTSD: 'false'
      PANTS_PROCESS_EXECUTION_LOCAL_PARALLELISM: '1'
      HONEYCOMB_API_KEY: --DISABLED--
      PANTS_OPENTELEMETRY_ENABLED: 'False'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Expose the test interpreter
        run: echo /opt/python/cp314-cp314/bin >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-${{ needs.source.outputs.head }}
          path: src/python/pants
      - name: Restore executable permissions
        run: chmod +x src/python/pants/bin/native_client src/python/pants/bin/sandboxer src/python/pants/bin/pants_lock
      - name: Run only the patch and its direct dependent suites
        env:
          BASE: ${{ needs.source.outputs.base }}
          EXPECTED_HEAD: ${{ needs.source.outputs.head }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          TIMEFORMAT='tests elapsed=%R user=%U system=%S seconds'
          time ./pants --changed-since="$BASE" --changed-dependents=direct lint test
      - name: Report test memory
        if: always()
        run: |
          if test -r /sys/fs/cgroup/memory.peak; then
            printf 'Tests peak memory (bytes): ' >> "$GITHUB_STEP_SUMMARY"
            cat /sys/fs/cgroup/memory.peak >> "$GITHUB_STEP_SUMMARY"
          fi

  consumer_source:
    if: >-
      github.repository == 'DSpotDevelopers/pants'
      && github.event_name == 'pull_request_target'
      && (github.event.pull_request.author_association == 'OWNER'
          || github.event.pull_request.author_association == 'MEMBER'
          || github.event.pull_request.author_association == 'COLLABORATOR')
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: source
    runs-on: [self-hosted, linux, x64, slot-cpus-1]
    timeout-minutes: 5
    outputs:
      head: ${{ steps.company.outputs.head }}
    steps:
      - id: company
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.COMPANY_READ_TOKEN }}
          script: |
            const {data: commit} = await github.rest.repos.getCommit({
              owner: 'DSpotDevelopers', repo: 'dspot-company-data', ref: 'main'
            });
            core.setOutput('head', commit.sha);

  consumers:
    if: >-
      github.repository == 'DSpotDevelopers/pants'
      && github.event_name == 'pull_request_target'
      && (github.event.pull_request.author_association == 'OWNER'
          || github.event.pull_request.author_association == 'MEMBER'
          || github.event.pull_request.author_association == 'COLLABORATOR')
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: [source, build, consumer_source]
    runs-on: [self-hosted, linux, x64, slot-medium]
    timeout-minutes: 30
    container: quay.io/pypa/manylinux_2_28_x86_64:latest
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - packages/design
          - packages/plugin-sdk
          - packages/store
          - workflows/accountancy-library/core
    env:
      CANDIDATE_VERSION: ${{ needs.build.outputs.version }}
      CONSUMER: ${{ matrix.consumer }}
      PANTS_PANTSD: 'false'
      PANTS_PROCESS_EXECUTION_LOCAL_PARALLELISM: '1'
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.source.outputs.head }}
          path: ${{ runner.temp }}/candidate-release
      - name: Select the built release executable
        run: |
          mapfile -t candidates < <(find "$RUNNER_TEMP/candidate-release" -type f \
            -name 'pants-pex*' ! -name '*.sha256' ! -name '*cp314t*')
          test "${#candidates[@]}" -eq 1
          chmod u+x "${candidates[0]}"
          printf 'PANTS_BIN=%s\n' "${candidates[0]}" >> "$GITHUB_ENV"
          echo /opt/python/cp314-cp314/bin >> "$GITHUB_PATH"
          state="$RUNNER_TEMP/pants-consumer-state"
          mkdir -p "$state/tmp" "$state/sandboxes"
          printf 'PANTS_NAMED_CACHES_DIR=%s/named-caches\n' "$state" >> "$GITHUB_ENV"
          printf 'PANTS_LOCAL_STORE_DIR=%s/local-store\n' "$state" >> "$GITHUB_ENV"
          printf 'XDG_CACHE_HOME=%s/bootstrap\n' "$state" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s/tmp\n' "$state" >> "$GITHUB_ENV"
          printf 'PANTS_LOCAL_EXECUTION_ROOT_DIR=%s/sandboxes\n' "$state" >> "$GITHUB_ENV"
      - name: Check out the private consumer repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: DSpotDevelopers/dspot-company-data
          ref: ${{ needs.consumer_source.outputs.head }}
          path: company
          token: ${{ secrets.COMPANY_READ_TOKEN }}
          persist-credentials: false
      - name: Resolve and test the consumer with this release
        working-directory: company
        env:
          CANDIDATE_HEAD: ${{ needs.source.outputs.head }}
        run: |
          pants=("$PANTS_BIN" "--pants-version=$CANDIDATE_VERSION" --no-pantsd)
          test "$("${pants[@]}" --version)" = "$CANDIDATE_VERSION"
          printf 'Pants source: %s; company source: %s; consumer: %s\n' \
            "$CANDIDATE_HEAD" "$(git rev-parse HEAD)" "$CONSUMER" >> "$GITHUB_STEP_SUMMARY"
          TIMEFORMAT='consumer elapsed=%R user=%U system=%S seconds'
          time {
            "${pants[@]}" tailor --check "$CONSUMER"
            "${pants[@]}" filedeps --transitive "$CONSUMER/package.json" > "$RUNNER_TEMP/export-files.txt"
            python3 - <<'CHECK_EXPORTS'
          import json
          import os
          from pathlib import Path

          consumer = Path(os.environ["CONSUMER"])
          manifest = json.loads((consumer / "package.json").read_text())
          files = set(Path(os.environ["RUNNER_TEMP"], "export-files.txt").read_text().splitlines())

          def destinations(value):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, dict):
                  for item in value.values():
                      yield from destinations(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from destinations(item)

          exports = set(destinations(manifest.get("exports", {})))
          if not exports:
              raise SystemExit("Consumer has no exports to qualify")
          for export in sorted(exports):
              if not export.startswith("./") or "*" in export:
                  raise SystemExit(f"Export needs a concrete local destination: {export}")
              path = (consumer / export).as_posix()
              if not (consumer / export).is_file() or path not in files:
                  raise SystemExit(f"Export absent from the package dependency graph: {path}")
          print(f"{consumer}: all {len(exports)} exported files belong to the package graph")
          CHECK_EXPORTS
            "${pants[@]}" check test "$CONSUMER::"
          }
      - name: Report consumer memory
        if: always()
        run: |
          if test -r /sys/fs/cgroup/memory.peak; then
            printf 'Consumer peak memory (bytes): ' >> "$GITHUB_STEP_SUMMARY"
            cat /sys/fs/cgroup/memory.peak >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove the private job checkout and downloaded candidate
        if: always()
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/company" "$RUNNER_TEMP/candidate-release" \
            "$RUNNER_TEMP/pants-consumer-state" "$RUNNER_TEMP/export-files.txt"

  result:
    if: >-
      always() && needs.source.result == 'success'
      && github.repository == 'DSpotDevelopers/pants'
      && github.event_name == 'pull_request_target'
      && (github.event.pull_request.author_association == 'OWNER'
          || github.event.pull_request.author_association == 'MEMBER'
          || github.event.pull_request.author_association == 'COLLABORATOR')
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: [source, build, tests, consumer_source, consumers]
    runs-on: [self-hosted, linux, x64, slot-cpus-1]
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          HEAD_SHA: ${{ needs.source.outputs.head }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          CONSUMER_RESULT: ${{ needs.consumers.result }}
        with:
          script: |
            const passed = process.env.BUILD_RESULT === 'success'
              && process.env.TEST_RESULT === 'success' && process.env.CONSUMER_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.HEAD_SHA,
              state: passed ? 'success' : 'failure', context: 'DSpot Pants',
              description: `Release build: ${process.env.BUILD_RESULT}; focused tests: ${process.env.TEST_RESULT}; consumers: ${process.env.CONSUMER_RESULT}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!passed) core.setFailed('The source build, focused tests and all four consumers must pass');
