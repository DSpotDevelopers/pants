# DSpot's nightly full run: every suite of the qualified scope (build-support/bin/dspot_qualification_scope.toml), once
# a day and on demand. A pull request runs only its change and the change's direct dependents (dspot-pants.yaml's
# `tests` job); a change whose direct dependents are most of Pants, such as an edit to src/python/pants/BUILD,
# qualifies here, dispatched on its branch.
name: DSpot Pants nightly

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dspot-pants-nightly-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  qualified-scope:
    if: github.repository == 'DSpotDevelopers/pants'
    # The tests job's runner class: the same suites' Docker and Buildbarn cells need the admitted socket and Compose.
    runs-on: [self-hosted, linux, x64, dspot, heavy-ok, docker-socket]
    # Every suite of the scope on one slot: the first runs measure it.
    timeout-minutes: 720
    env:
      PY: python3.14
      PANTS_PANTSD: 'false'
      PANTS_REMOTE_CACHE_READ: 'false'
      PANTS_REMOTE_CACHE_WRITE: 'false'
      HONEYCOMB_API_KEY: --DISABLED--
      PANTS_OPENTELEMETRY_ENABLED: 'False'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      # The whole scope reaches pants/jvm and pants/bsp, which need a JDK (as upstream's own test jobs install it).
      - name: Install AdoptJDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: adopt
          java-version: '11'
      # At least the interpreters the tests job installs, and every Python Pants supports for the interpreter-dependent
      # suites the whole scope reaches; 3.14 last, the job's default python.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: |
            3.8.18
            3.9
            3.10.22
            3.11.18
            3.12
            3.13
            3.14
      # `./pants` builds the native engine from this source, as the build job's toolchain does.
      - name: Install the source's Rust toolchain
        run: |
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          "$HOME/.cargo/bin/rustup" default "$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' src/rust/rust-toolchain)"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: src/rust
          cache-bin: 'false'
      - name: Install Protoc
        uses: benjyw/setup-protoc@fa4f90fddf8838036cbdeadf1262b9755f6cfb85
        with:
          version: 23.x
      - name: Pants' processes, one per CPU the slot is granted
        run: |
          set -euo pipefail
          cpus="$("$PY" build-support/bin/dspot_slot_cpus.py)"
          echo "PANTS_PROCESS_EXECUTION_LOCAL_PARALLELISM=${cpus}" >> "$GITHUB_ENV"
          echo "Pants' process parallelism: ${cpus}"
      - name: Every suite of the qualified scope
        env:
          # As the tests job: DSpot's Pants build does not use Docker environments, and the runners give no job a Docker
          # daemon Pants' sandbox may bind-mount.
          PANTS_PYTEST_ARGS: >-
            ["--deselect=src/python/pants/backend/python/providers/python_build_standalone/rules_test.py::test_docker_python_path_uses_named_caches_in_container"]
        run: |
          set -euo pipefail
          "$PY" build-support/bin/dspot_qualified_selection.py --all > "$RUNNER_TEMP/qualified.txt"
          echo "qualified targets: $(wc -l < "$RUNNER_TEMP/qualified.txt")"
          TIMEFORMAT='tests elapsed=%R user=%U system=%S seconds'
          time ./pants --spec-files="$RUNNER_TEMP/qualified.txt" test
      - name: Report test memory
        if: always()
        run: |
          if test -r /sys/fs/cgroup/memory.peak; then
            printf 'Tests peak memory (bytes): ' >> "$GITHUB_STEP_SUMMARY"
            cat /sys/fs/cgroup/memory.peak >> "$GITHUB_STEP_SUMMARY"
          fi
